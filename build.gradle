plugins {
    id 'java'
    id 'idea'
    id 'jacoco'
    id 'maven-publish'
    id 'com.github.blueboxware.tocme' version '1.8'
    id 'org.springframework.boot' version '3.5.9'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.sonarqube' version '7.2.2.6593'
    id 'org.owasp.dependencycheck' version '12.1.9'
}

/*
 * This file isn't uploaded to GitHub.
 * At the moment, it just contains the GitHub token for the semantic release plugin,
 * so you should come along very well without it. :)
 */
if (file('secrets.gradle').exists()) {
    apply from: 'secrets.gradle'
} else {
    //Possibly we're using GitHub Actions, where the token is set automatically:
    ext.ghToken = "$System.env.GITHUB_TOKEN"
    ext.ghActor = "$System.env.GITHUB_ACTOR"
}

sonar {
    properties {
        property "sonar.projectKey", "storesthal_storesthal_2f0e2536-14e8-4df7-a6f9-cad0ce8f11d2"
        property "sonar.projectName", "Storesthal"
        property "sonar.qualitygate.wait", true
    }
}

group = 'com.github.ahuemmer'

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        url = 'https://jitpack.io'
    }
    maven {
        url = 'https://repo.maven.apache.org/maven2'
    }
    maven {
        url = 'https://maven.pkg.github.com/ahuemmer/storesthal'
        credentials {
            username = project.ghActor
            password = project.ghToken
        }
    }
}

ext {
    springBootVersion = '3.5.9'
    isGitLab = !"$System.env.CI_SERVER_HOST".isBlank() && !"$System.env.CI_SERVER_HOST".contains('github')
    isGitHub = "$System.env.GITHUB_ACTIONS" == "true"
}

dependencies {
    implementation group: 'org.springframework.boot', name: 'spring-boot-starter-json', version: springBootVersion
    implementation group: 'org.springframework.hateoas', name: 'spring-hateoas', version: '2.5.1'
    implementation group: 'org.apache.commons', name: 'commons-lang3', version: '3.19.0'

    testImplementation group: 'org.springframework.boot', name: 'spring-boot-starter-test', version: springBootVersion
    testImplementation group: 'org.apache.commons', name: 'commons-text', version: '1.14.0'
    testImplementation group: 'org.wiremock.integrations', name: 'wiremock-spring-boot', version: '3.10.6'
}


test {
    useJUnitPlatform()
    testLogging.showStandardStreams = true
    finalizedBy jacocoTestReport
}

javadoc {
    options.encoding = 'UTF-8'
    options.charSet = 'UTF-8'
}

task sourcesJar(type: Jar, dependsOn: classes) {
    archiveClassifier = 'sources'
    from sourceSets.main.allSource
}

task javadocJar(type: Jar, dependsOn: javadoc) {
    archiveClassifier = 'javadoc'
    from javadoc.destinationDir
}

def pomConfig = {
    scm {
        url 'https://github.com/ahuemmer/storesthal'
    }
    distributionManagement {
        repository {
            id 'github'
            name 'Storesthal Apache Maven Packages'
            url 'https://maven.pkg.github.com/ahuemmer/storesthal'
        }
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from(components.java)
            artifact sourcesJar
            artifact javadocJar

            pom.withXml {
                asNode().children().last() + pomConfig
            }
        }
    }

    repositories {
        if (project.isGitHub || !project.isGitLab) {
            if (!project.version.endsWith('-SNAPSHOT')) {
                maven {
                    name = "GitHubPackages"
                    url = "https://maven.pkg.github.com/ahuemmer/storesthal"
                    credentials {
                        username = project.ghActor ?: "$System.env.GH_ACTOR"
                        password = project.ghToken ?: "$System.env.GH_TOKEN"
                    }
                }
            }
        }
        if (!project.isGitHub) {
            maven {
                name = "local"
                if (project.version.endsWith('-SNAPSHOT')) {
                    url project.hasProperty('localSnapshotRepositoryUrl') ? project.localSnapshotRepositoryUrl : "$System.env.LOCAL_SNAPSHOT_REPOSITORY_URL"
                    credentials {
                        username = project.hasProperty('localSnapshotRepositoryUser') ? project.localSnapshotRepositoryUser : "$System.env.LOCAL_SNAPSHOT_REPOSITORY_USER"
                        password = project.hasProperty('localSnapshotRepositoryPassword') ? project.localSnapshotRepositoryPassword : "$System.env.LOCAL_SNAPSHOT_REPOSITORY_PASSWORD"
                    }
                } else {
                    url project.hasProperty('localReleaseRepositoryUrl') ? project.localReleaseRepositoryUrl : "$System.env.LOCAL_RELEASE_REPOSITORY_URL"
                    credentials {
                        username = project.hasProperty('localReleaseRepositoryUser') ? project.localReleaseRepositoryUser : "$System.env.LOCAL_RELEASE_REPOSITORY_USER"
                        password = project.hasProperty('localReleaseRepositoryPassword') ? project.localReleaseRepositoryPassword : "$System.env.LOCAL_RELEASE_REPOSITORY_PASSWORD"
                    }
                }
            }
        }
    }
}


tocme {
    doc(file('README.md'))
}

springBoot {
    mainClass = 'com.github.ahuemmer.storesthal.Storesthal'
}

tasks.publish.dependsOn checkTocs

jacocoTestReport {
    reports {
        xml.required = true
    }
}